<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEKXL // DARK TECHNO VISUALIZER</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importando o Three.js para o ambiente 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="scanlines"></div>
    <div id="vignette"></div>

    <div id="ui-container">
        <h1 class="glitch" data-text="MEKXL // SYSTEM">MEKXL // SYSTEM</h1>
        <div class="controls">
            <button id="btn-mic">Captar Sistema / Mic</button>
            <label for="audio-upload" class="custom-file-upload">Subir MP3 / WAV</label>
            <input type="file" id="audio-upload" accept="audio/*">
        </div>
        <audio id="audio-player" controls></audio>
    </div>

    <canvas id="visualizer"></canvas>
    
    <script src="script.js"></script>
</body>
</html>
